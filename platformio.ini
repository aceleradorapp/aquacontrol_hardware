; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev ; 💡 Mudado de esp32-s3 para o chip ESP32 clássico!
framework = arduino
monitor_speed = 115200

; Travando a gravação na porta que você descobriu para o chip de hardware
upload_port = COM6   
monitor_port = COM6

; WiFiManager/OneWire/DallasTemperature removidas (07-espc): eram do simulador antigo e
; não são usadas por este firmware (Wi-Fi aqui é WiFi.begin() direto com Segredos.h; não
; há sensor DS18B20 neste módulo). Adafruit MCP23017 removida (11-espc): os 16 relés agora
; são acionados direto nos GPIOs nativos do ESP32, sem expansor I2C — ver
; 01-espc-geral/11_esquema_ligacao_reles.md.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4